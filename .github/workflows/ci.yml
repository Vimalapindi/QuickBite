name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: quickbite, POSTGRES_PASSWORD: quickbite_dev_password, POSTGRES_DB: quickbite_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U quickbite" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env: { RABBITMQ_DEFAULT_USER: quickbite, RABBITMQ_DEFAULT_PASS: quickbite_dev_password }
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 10s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
        env: { DATABASE_URL: "postgresql://quickbite:quickbite_dev_password@localhost:5432/quickbite_test" }
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgresql://quickbite:quickbite_dev_password@localhost:5432/quickbite_test
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://quickbite:quickbite_dev_password@localhost:5672
          JWT_SECRET: ci-secret-ci-secret-ci-secret
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
